name: dzikr_tasbih
description: Modern Tasbih App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  iconsax: ^0.0.8
  font_awesome_flutter: 10.6.0

  # Animation
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  flutter_heatmap_calendar: ^1.0.5

  flutter_colorpicker: ^1.1.0

  # Storage
  shared_preferences: ^2.5.3

  # Haptic
  vibration: ^2.0.0

  # Chart
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

